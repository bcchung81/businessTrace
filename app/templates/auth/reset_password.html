<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 초기화 - 뉴스 홈페이지</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.1);
        }
        
        .btn-auth {
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .btn-auth:hover {
            background: #3367d6;
        }
        
        .btn-auth:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .auth-links a {
            color: #4285f4;
            text-decoration: none;
            font-size: 14px;
        }
        
        .auth-links a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #388e3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .temp-password {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 16px;
            text-align: center;
            display: none;
        }
        
        .info-box {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-key"></i> 비밀번호 초기화</h1>
            <p>가입한 이메일 주소로 비밀번호를 초기화하세요</p>
        </div>
        
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            비밀번호 초기화 시 이메일 주소 앞부분 + "123!" 형태로 임시 비밀번호가 생성됩니다.
        </div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" name="email" required>
                <div class="error-message" id="emailError"></div>
            </div>
            
            <button type="submit" class="btn-auth" id="resetBtn">
                <i class="fas fa-key"></i> 비밀번호 초기화
            </button>
        </form>
        
        <div class="temp-password" id="tempPassword">
            <strong>임시 비밀번호:</strong><br>
            <span id="tempPasswordText"></span>
        </div>
        
        <div class="auth-links">
            <a href="/auth/login">로그인으로 돌아가기</a>
        </div>
        
        <div class="success-message" id="successMessage"></div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 에러 메시지 초기화
            clearMessages();
            
            const email = document.getElementById('email').value.trim();
            
            // 기본 검증
            if (!email) {
                showError('emailError', '이메일 주소를 입력해주세요.');
                return;
            }
            
            // 버튼 비활성화
            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 초기화 중...';
            
            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('비밀번호가 초기화되었습니다!');
                    showTempPassword(data.temp_password);
                } else {
                    showError('emailError', data.error || '비밀번호 초기화 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('비밀번호 초기화 오류:', error);
                showError('emailError', '네트워크 오류가 발생했습니다.');
            } finally {
                // 버튼 활성화
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-key"></i> 비밀번호 초기화';
            }
        });
        
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.style.display = 'block';
        }
        
        function showTempPassword(password) {
            const tempPasswordElement = document.getElementById('tempPassword');
            const tempPasswordText = document.getElementById('tempPasswordText');
            tempPasswordText.textContent = password;
            tempPasswordElement.style.display = 'block';
        }
        
        function clearMessages() {
            const errorElements = document.querySelectorAll('.error-message');
            errorElements.forEach(element => {
                element.style.display = 'none';
            });
            
            const successElement = document.getElementById('successMessage');
            successElement.style.display = 'none';
            
            const tempPasswordElement = document.getElementById('tempPassword');
            tempPasswordElement.style.display = 'none';
        }
    </script>
</body>
</html>
