<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - 뉴스 홈페이지</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.1);
        }
        
        .btn-auth {
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .btn-auth:hover {
            background: #3367d6;
        }
        
        .btn-auth:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .auth-links a {
            color: #4285f4;
            text-decoration: none;
            font-size: 14px;
        }
        
        .auth-links a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #388e3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-lock"></i> 비밀번호 변경</h1>
            <p>새로운 비밀번호로 변경하세요</p>
        </div>
        
        <form id="changeForm">
            <div class="form-group">
                <label for="currentPassword">현재 비밀번호</label>
                <input type="password" id="currentPassword" name="currentPassword" required>
                <div class="error-message" id="currentPasswordError"></div>
            </div>
            
            <div class="form-group">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword" required>
                <div class="password-requirements">
                    • 최소 8자 이상<br>
                    • 영문, 숫자, 특수문자 중 최소 2가지 조합
                </div>
                <div class="error-message" id="newPasswordError"></div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
            
            <button type="submit" class="btn-auth" id="changeBtn">
                <i class="fas fa-lock"></i> 비밀번호 변경
            </button>
        </form>
        
        <div class="auth-links">
            <a href="/">메인 페이지로 돌아가기</a>
            <a href="/auth/logout" onclick="event.preventDefault(); logout();">로그아웃</a>
        </div>
        
        <div class="success-message" id="successMessage"></div>
    </div>

    <script>
        // 로그아웃 기능
        async function logout() {
            try {
                const response = await fetch('/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    window.location.href = '/auth/login';
                } else {
                    alert('로그아웃 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('로그아웃 오류:', error);
                alert('로그아웃 중 오류가 발생했습니다.');
            }
        }
        document.getElementById('changeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 에러 메시지 초기화
            clearErrors();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // 기본 검증
            let hasError = false;
            
            if (!currentPassword) {
                showError('currentPasswordError', '현재 비밀번호를 입력해주세요.');
                hasError = true;
            }
            
            if (!newPassword) {
                showError('newPasswordError', '새 비밀번호를 입력해주세요.');
                hasError = true;
            }
            
            if (!confirmPassword) {
                showError('confirmPasswordError', '새 비밀번호 확인을 입력해주세요.');
                hasError = true;
            }
            
            if (newPassword !== confirmPassword) {
                showError('confirmPasswordError', '새 비밀번호가 일치하지 않습니다.');
                hasError = true;
            }
            
            if (hasError) return;
            
            // 버튼 비활성화
            const changeBtn = document.getElementById('changeBtn');
            changeBtn.disabled = true;
            changeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 변경 중...';
            
            try {
                const response = await fetch('/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('비밀번호가 변경되었습니다!');
                    // 폼 초기화
                    document.getElementById('changeForm').reset();
                } else {
                    if (response.status === 401) {
                        showError('currentPasswordError', data.error || '현재 비밀번호가 올바르지 않습니다.');
                    } else {
                        showError('newPasswordError', data.error || '비밀번호 변경 중 오류가 발생했습니다.');
                    }
                }
            } catch (error) {
                console.error('비밀번호 변경 오류:', error);
                showError('newPasswordError', '네트워크 오류가 발생했습니다.');
            } finally {
                // 버튼 활성화
                changeBtn.disabled = false;
                changeBtn.innerHTML = '<i class="fas fa-lock"></i> 비밀번호 변경';
            }
        });
        
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.style.display = 'block';
        }
        
        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            errorElements.forEach(element => {
                element.style.display = 'none';
            });
            
            const successElement = document.getElementById('successMessage');
            successElement.style.display = 'none';
        }
    </script>
</body>
</html>
