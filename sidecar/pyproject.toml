[project]
name = "seonggwa-sidecar"
version = "0.1.0"
description = "성과돋보기 파이썬 사이드카 — 파이썬 전용 라이브러리만 맡는 선택적 계층"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
