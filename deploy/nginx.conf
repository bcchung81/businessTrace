# 성과돋보기 — TLS 를 여기서 끊고 127.0.0.1:3000 의 Node 로 넘긴다.
# /etc/nginx/sites-available/seonggwa 로 복사하고 sites-enabled 에 심볼릭 링크한다.

server {
    listen 80;
    server_name _;
    # 인증서는 certbot 이 넣는다. 받기 전에는 이 블록만으로 뜬다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/example.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.kr/privkey.pem;

    # 엑셀 업로드·기업 일괄 등록이 지나간다.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Auth.js 가 호스트를 믿지 못하면 세션 요청을 전부 UntrustedHost 로 막는다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 로그인 레이트리밋이 이 헤더의 **마지막** 값을 접속 주소로 쓴다.
        # $proxy_add_x_forwarded_for 는 클라이언트가 보낸 값 뒤에 실제 peer 를 붙인다 — 마지막 하나만 우리가 적은 것이다.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 배치 진행률이 SSE 다. 버퍼링을 켜 두면 이벤트가 갇혀 화면이 멈춘 것처럼 보인다.
        proxy_buffering off;
        proxy_cache off;
        # 50개사 분석이 한 시간을 넘길 수 있다. 기본 60초면 그 전에 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
