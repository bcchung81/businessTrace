# 성과돋보기 프로덕션 구성 — 웹 1컨테이너 + 마이그레이션·스크립트용 CLI.
x-db-env: &db-env
  DATABASE_URL: "file:/app/db/prod.db"
  TZ: Asia/Seoul

services:
  # 웹보다 먼저 완주해야 하는 일회성 서비스. 실패하면 web 이 뜨지 않는다 —
  # 스키마가 뒤처진 채로 뜨면 첫 요청에서야 알게 된다.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: cli
    image: seonggwa-cli:latest
    restart: "no"
    env_file:
      - ../.env.production
    environment: *db-env
    command: ["npx", "prisma", "migrate", "deploy"]
    volumes:
      - db:/app/db
      - files:/app/data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: runner
    image: seonggwa-web:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../.env.production
    environment:
      # 컨테이너·리버스프록시 뒤에서는 Auth.js 가 호스트를 신뢰하지 않으면 세션 요청이 전부 막힌다.
      AUTH_TRUST_HOST: "true"
      <<: *db-env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # SQLite 파일과 업로드·리포트 산출물은 이미지 밖에 둔다 — 재배포로 지워지면 안 된다.
      # /app/prisma 는 마운트하지 않는다: 볼륨이 이미지의 migrations/ 를 가리면 새 마이그레이션이 조용히 무시된다.
      - db:/app/db
      - files:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 계정 발급·정기 수집 스크립트를 돌리는 자리. 평소에는 뜨지 않는다(profiles).
  #   docker compose -f deploy/docker-compose.prod.yml --profile tools run --rm cli npx tsx scripts/collect-pension.ts 2026
  cli:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: cli
    image: seonggwa-cli:latest
    profiles: ["tools"]
    env_file:
      - ../.env.production
    environment: *db-env
    volumes:
      - db:/app/db
      - files:/app/data

volumes:
  db:
  files:
